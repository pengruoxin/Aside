schema:
  schema_id: aside_pinyin
  name: 句外拼音
  version: "0.3"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - "derive/^([nl])ue$/$1ve/"
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^([zcs]h).+$/$1/"
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: noop
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
menu:
  page_size: 7
