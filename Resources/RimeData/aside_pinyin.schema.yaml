schema:
  schema_id: aside_pinyin
  name: 句外拼音
  version: "0.3"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
menu:
  page_size: 7
