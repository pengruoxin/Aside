name: Native input method
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_offline:
        description: Include the pinned model and test real offline inference
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASIDE_INCLUDE_MODEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.full_offline == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build-only Pinyin dependency
        run: brew install librime
      - uses: actions/cache@v4
        with:
          path: .build-deps/llama
          key: llama-v0.7.0-macos26-arm64-static-1
      - uses: actions/cache@v4
        if: env.ASIDE_INCLUDE_MODEL == '1'
        with:
          path: .build-deps/models
          key: qwen25-15b-6a1a2eb6
      - name: Build and test actual input method
        run: bash scripts/build-ime.sh
      - name: Package complete offline installer
        if: env.ASIDE_INCLUDE_MODEL == '1'
        run: bash scripts/package-dmg.sh
      - name: Build record
        run: |
          swift --version > dist/build-status.txt
          echo "InputMethodKit / Rime / offline runtime; no independent editor." >> dist/build-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AsideInputMethod-ARM64
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/build-status.txt
            dist/smoke/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AsideInputMethod-ARM64
          path: release-files
      - name: Publish offline input method
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find release-files -name '*.dmg' | wc -l)" -eq 1
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/*.dmg release-files/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/*.dmg release-files/*.sha256 \
              --title "句外输入法 $GITHUB_REF_NAME · 完整离线测试版" \
              --notes-file docs/ime-release-notes.md --prerelease
          fi
